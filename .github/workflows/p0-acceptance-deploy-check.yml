name: P0 Acceptance Deploy Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify P0 acceptance is embedded in Metadata Admin
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/p0-check && cd /tmp/p0-check
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund puppeteer-core@24.16.0
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({ headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage();
              await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36');

              async function openMetadata() {
                try {
                  await page.goto(`https://aliaburas.com/admin/metadata?deploy-check=${Date.now()}`, { waitUntil:'domcontentloaded', timeout:15000 });
                } catch (error) {
                  console.log(`Navigation continued after ${error.name}`);
                }
                await sleep(1200);
                for (let i = 0; i < 6; i += 1) {
                  const html = await page.content();
                  const title = await page.title();
                  if (!/Checking your browser/i.test(html) && !/Checking your browser/i.test(title)) return;
                  console.log(`Hostinger browser verification ${i + 1}/6`);
                  await sleep(9000);
                  try { await page.reload({ waitUntil:'domcontentloaded', timeout:15000 }); } catch {}
                  await sleep(1000);
                }
              }

              let ready = false;
              for (let attempt = 1; attempt <= 24; attempt += 1) {
                await openMetadata();
                const title = await page.title();
                const html = await page.content();
                const metadataLive = /Metadata.*Archive Control/i.test(title) || /Checking archive save capability|Metadata Rebuild/i.test(html);
                if (!metadataLive) {
                  console.log(`Waiting for Metadata page ${attempt}/24`);
                  await sleep(12000);
                  continue;
                }

                const api = await page.evaluate(async () => {
                  const r = await fetch(`/api/admin/metadata-acceptance-status?assetId=aar_886f61bf6153_ba16f48a&deploy=${Date.now()}`);
                  return { status:r.status, text:await r.text() };
                });
                console.log(`Metadata acceptance API attempt ${attempt}/24 -> ${api.status}`);
                if (api.status === 401 && /Administrator authorization required/i.test(api.text)) {
                  ready = true;
                  break;
                }
                if (![404, 401].includes(api.status)) throw new Error(`METADATA_ACCEPTANCE_UNEXPECTED:${api.status}:${api.text.slice(0,180)}`);
                await sleep(12000);
              }

              if (!ready) throw new Error('METADATA_ACCEPTANCE_NOT_DEPLOYED');
              console.log('P0_ACCEPTANCE_IN_METADATA_DEPLOYED_OK');
            } finally { await browser.close(); }
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
