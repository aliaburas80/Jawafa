name: Ali Portfolio Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify aliaburas.com with a real browser
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is not installed on this runner."
            exit 1
          fi
          echo "Using browser: $CHROME"
          "$CHROME" --version

          mkdir -p /tmp/ali-portfolio-smoke
          cd /tmp/ali-portfolio-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund puppeteer-core@24.16.0
          export CHROME

          node <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const base = 'https://aliaburas.com';
            const executablePath = process.env.CHROME;
            const ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const browser = await puppeteer.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu'],
            });

            try {
              const page = await browser.newPage();
              await page.setUserAgent(ua);
              await page.setViewport({ width: 1440, height: 1000 });

              async function open(path, markers = []) {
                const url = `${base}${path}`;
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                console.log(`${path} initial -> ${response?.status() ?? 'no-response'}`);

                for (let attempt = 1; attempt <= 5; attempt++) {
                  const html = await page.content();
                  const title = await page.title();
                  const challenged = /Checking your browser before accessing/i.test(html) || /Checking your browser/i.test(title);
                  if (!challenged) break;
                  console.log(`${path} Hostinger browser verification attempt ${attempt}/5`);
                  await sleep(9000);
                }

                const html = await page.content();
                const title = await page.title();
                if (/Checking your browser before accessing/i.test(html) || /Checking your browser/i.test(title)) {
                  throw new Error(`HOSTINGER_CHALLENGE_PERSISTED:${path}`);
                }

                console.log(`${path} final title -> ${title}`);
                console.log(`${path} final url -> ${page.url()}`);

                for (const marker of markers) {
                  if (!html.includes(marker)) {
                    throw new Error(`MISSING_MARKER:${path}:${marker}`);
                  }
                }
              }

              await open('/', ['Ali Abu Ras', 'عربي', 'I seek the soul of a place']);
              await open('/selected-works', ['data-selected-works-performance="v2"', 'Selected']);
              await open('/competitions-awards', ['Competitions', 'Awards', 'عربي']);
              await open('/robots.txt', ['Disallow: /admin']);
              await open('/sitemap.xml', ['/selected-works']);

              console.log('ALI_PORTFOLIO_PRODUCTION_OK');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
